name: Encore QA
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "combat/**"
      - "tests/combat-*"
      - "scripts/**"
      - "docs/**"
      - "package*.json"
      - ".github/workflows/encore-qa.yml"
permissions:
  contents: read
concurrency:
  group: encore-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  combat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Contracts, Node tests and both builds
        run: |
          mkdir -p audit-combat/ci
          set -o pipefail
          npm run qa 2>&1 | tee audit-combat/ci/qa.log
      - name: Install browser verification runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Browser verification
        run: |
          if test -f scripts/run-combat-ci.mjs; then
            node scripts/run-combat-ci.mjs
          else
            python3 -m http.server 4178 --bind 127.0.0.1 > /tmp/encore-http.log 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4178/combat/ > /dev/null; then break; fi
              sleep 1
            done
            node tests/combat-browser.mjs
          fi
      - name: Build reviewable delivery
        if: ${{ hashFiles('scripts/package-combat-release.mjs') != '' }}
        run: node scripts/package-combat-release.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encore-evidence-${{ github.event.pull_request.head.sha }}
          path: audit-combat/
          retention-days: 14
          if-no-files-found: error
      - name: Upload standalone delivery
        if: ${{ success() && hashFiles('release/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: encore-standalone-${{ github.event.pull_request.head.sha }}
          path: release/
          retention-days: 30
          if-no-files-found: error
